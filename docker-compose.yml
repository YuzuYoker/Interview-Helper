services:
  qdrant:
    image: qdrant/qdrant:v1.16
    volumes:
      # 全新卷！宿主 local 模式数据(SQLite)与 server(RocksDB)不兼容，绝不映射
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333" # 本地调试用；生产注释掉
    healthcheck:
      # qdrant 镜像无 curl，用 bash /dev/tcp 做 TCP 探测
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  redis:
    image: redis:latest
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379" # 本地调试用
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: .
    env_file: .env # 密钥不进镜像，运行时注入
    environment:
      QDRANT_MODE: server # 容器内连 qdrant 服务
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_DEVICE: cpu # 容器无 GPU（Windows Docker 无透传）
      RERANKER_DEVICE: cpu
      REDIS_URL: redis://redis:6379/0
      WEB_FETCH_COMMAND: "python -m mcp_server_fetch" # 容器内用装好的包，不依赖 uvx
      HF_HOME: /hf-cache
      TRANSFORMERS_OFFLINE: "1" # 只读挂载宿主缓存，禁网络下载
      WARMUP_ON_STARTUP: "true"
    volumes:
      - backend-data:/app/backend/data # uploads 持久化
      # 本地验证专用：宿主 HF 模型缓存只读挂载（生产改为 named volume 预热）。
      # 宿主路径不写死——走根目录 .env 的 HF_CACHE_DIR（.env 已 gitignore，不含隐私）。
      # 未设置该变量时 compose 会报错，按提示在 .env 里配置，或改用 named volume（见 README）。
      - type: bind
        source: ${HF_CACHE_DIR}
        target: /hf-cache
        read_only: true
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=3).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s # 首启含自动 seed（CPU 1-5 分钟），放宽

volumes:
  qdrant-data:
  redis-data:
  backend-data: